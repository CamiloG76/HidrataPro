<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro rápido de ingesta de agua</title>
</head>

<body>

    <header>
        <h1>HidrataPro</h1>
        <h2>Registro rápido de ingesta de agua</h2>
    </header>

    <main>

        <section>
            <h2>Registrar consumo de agua</h2>

            <p>
                Selecciona la cantidad de agua que deseas registrar:
            </p>

            <button type="button">+250 ml</button>

            <button type="button">+500 ml</button>

        </section>


        <section>
            <h3>Ingresar cantidad manual</h3>

            <label for="cantidad">
                Cantidad de agua:
            </label>

            <input
                type="number"
                id="cantidad"
                name="cantidad"
                placeholder="Ingrese los ml"
            >

            <span>ml</span>

        </section>


        <section>
            <button type="button">
                Registrar consumo
            </button>
        </section>


        <section>
            <h3>Último registro</h3>

            <p>
                Aquí se mostrará el último consumo registrado.
            </p>

            <button type="button">
                Deshacer último registro
            </button>
        </section>

    </main>

    <footer>
        <p>HidrataPro</p>
    </footer>

</body>

</html>
